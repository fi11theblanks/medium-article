<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dexter morgan</title>
  <style>
    /* Tüm stil burada, dış dosyaya gerek yok */
    * { box-sizing: border-box; }

    body {
      background-color: #a6c6c6; /* Masaüstü yeşili */
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Tahoma', 'Geneva', sans-serif;
    }

    .browser {
      width: 900px;
      height: 600px;
      background-color: #c0c0c0;
      border: 3px solid;
      border-color: #dfdfdf #000 #000 #dfdfdf;
      display: flex;
      flex-direction: column;
      box-shadow: 10px 10px 0px rgba(0,0,0,0.1);
    }

    .title-bar {
      background: #000080;
      color: white;
      padding: 4px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 14px;
    }

    .controls button {
      background: #c0c0c0;
      border: 2px solid;
      border-color: #ffffff #000 #000 #ffffff;
      font-family: monospace;
      font-weight: bold;
      cursor: pointer;
      margin-left: 2px;
    }

    .menu {
      display: flex;
      gap: 12px;
      padding: 4px 8px;
      border-bottom: 1px solid #808080;
      font-size: 13px;
    }

    .windows-area {
      flex-grow: 1;
      padding: 20px;
      display: flex;
      gap: 20px;
      background-color: #3a6ea5; /* İçerik arkası mavi ekran */
      overflow: auto;
    }

    .window {
      background-color: #c0c0c0;
      border: 2px solid;
      border-color: #dfdfdf #000 #000 #dfdfdf;
      width: 350px;
      height: fit-content;
      display: flex;
      flex-direction: column;
    }

    .window-header {
      background: #808080;
      color: white;
      padding: 2px 6px;
      font-size: 12px;
      font-weight: bold;
    }

    .window-content {
      background: white;
      margin: 4px;
      padding: 15px;
      border: 2px solid;
      border-color: #808080 #dfdfdf #dfdfdf #808080;
      min-height: 150px;
    }

    .heading { color: #029702; font-size: 20px; margin: 0 0 10px 0; }
    .paragraph { font-size: 14px; line-height: 1.4; color: #000; }

    .status-bar {
      background: #c0c0c0;
      border-top: 2px solid #808080;
      padding: 2px;
      display: flex;
      font-size: 11px;
    }

    .field {
      border: 1px solid;
      border-color: #808080 #fff #fff #808080;
      padding: 2px 8px;
      margin-right: 2px;
    }
  </style>
</head>
<body>

  <div class="browser">
    <div class="title-bar">
      <span>dexter morgan</span>
      <div class="controls">
        <button> _ </button>
        <button> [] </button>
        <button> X </button>
      </div>
    </div>

    <div class="menu">
      <span><u>F</u>ile</span>
      <span><u>E</u>dit</span>
      <span><u>H</u>elp</span>
    </div>

    <div class="windows-area">
      <section class="window">
        <div class="window-header">about me</div>
        <div class="window-content">
          <h1 class="heading">Interests</h1>
          <p class="paragraph">Checking for blood spatter patterns in Miami.</p>
          <p class="paragraph">Precision is everything.</p>
        </div>
      </section>

      <section class="window">
        <div class="window-header">links</div>
        <div class="window-content">
          <h1 class="heading">More</h1>
          <p class="paragraph">Everything is hidden in the code.</p>
          <a href="#" style="color: blue;">incriminating_link.exe</a>
        </div>
      </section>
    </div>

    <div class="status-bar">
      <div class="field" style="flex-grow: 1;">System: Online</div>
      <div class="field">Miami Metro Police</div>
    </div>
  </div>

</body>
</html>
